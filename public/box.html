
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎤 Karaoké Box</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --accent: #ff2d55;
    --accent2: #bf5af2;
    --gold: #ffd60a;
    --text: #f5f5f7;
    --muted: #6e6e73;
    --green: #30d158;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 28px;
    background: var(--surface);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    flex-shrink: 0;
    gap: 16px;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.8rem;
    letter-spacing: 4px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    flex-shrink: 0;
  }

  .singers-bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    flex: 1;
    justify-content: center;
  }

  .singer-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 0.78rem;
    animation: chipIn 0.3s ease;
  }

  .singer-chip.active {
    background: rgba(255,45,85,0.2);
    border-color: var(--accent);
  }

  .mic-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted);
    transition: all 0.2s;
  }

  .singer-chip.active .mic-dot {
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
    animation: blink 1s infinite;
  }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
  @keyframes chipIn { from{opacity:0;transform:scale(.8)} to{opacity:1;transform:scale(1)} }

  .status-pill {
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 600;
    flex-shrink: 0;
    border: 1px solid;
  }
  .status-pill.waiting { background: rgba(255,214,10,.1); color: var(--gold); border-color: rgba(255,214,10,.3); }
  .status-pill.ok { background: rgba(48,209,88,.12); color: var(--green); border-color: rgba(48,209,88,.3); }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 300px;
    overflow: hidden;
  }

  .karaoke-zone {
    display: flex;
    flex-direction: column;
    padding: 20px 24px;
    gap: 14px;
    overflow: hidden;
  }

  .song-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: 2px;
    color: var(--muted);
  }

  .player-container {
    flex: 1;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255,255,255,0.07);
    min-height: 0;
  }

  #videoPlayer, #audioPlayer {
    width: 100%; height: 100%;
    object-fit: contain;
    display: none;
  }

  .placeholder {
    text-align: center;
    color: var(--muted);
  }
  .placeholder .icon { font-size: 3.5rem; margin-bottom: 10px; }
  .placeholder p { font-size: 0.85rem; line-height: 1.6; }

  .controls-row {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }

  label.btn-load {
    padding: 9px 18px;
    background: var(--accent);
    color: white;
    border-radius: 8px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    flex-shrink: 0;
  }
  label.btn-load:hover { background: #ff4d6b; }
  input[type="file"] { display: none; }

  .vol-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.75rem;
    color: var(--muted);
    flex: 1;
    min-width: 140px;
  }

  input[type="range"] {
    -webkit-appearance: none;
    height: 3px;
    border-radius: 2px;
    background: rgba(255,255,255,0.15);
    outline: none;
    flex: 1;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 13px; height: 13px;
    border-radius: 50%;
    background: var(--text);
  }

  /* SIDEBAR */
  .sidebar {
    background: var(--surface);
    border-left: 1px solid rgba(255,255,255,0.06);
    display: flex;
    flex-direction: column;
    padding: 20px 16px;
    gap: 18px;
    overflow-y: auto;
  }

  .s-title {
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .qr-wrap {
    background: white;
    border-radius: 10px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  #qrCanvas { width: 150px; height: 150px; }

  .join-url {
    font-size: 0.6rem;
    color: #444;
    text-align: center;
    word-break: break-all;
  }

  .vu-list { display: flex; flex-direction: column; gap: 8px; }

  .vu-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.72rem;
  }

  .vu-name {
    width: 75px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text);
  }

  .vu-bg {
    flex: 1;
    height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 3px;
    overflow: hidden;
  }

  .vu-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--green), var(--gold), var(--accent));
    border-radius: 3px;
    transition: width .05s;
  }

  .empty-hint {
    font-size: 0.75rem;
    color: var(--muted);
    font-style: italic;
  }

  /* Orbs de fond */
  .orbs { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .orb { position:absolute; border-radius:50%; filter:blur(80px); opacity:.1; }
  .orb1 { width:350px;height:350px;background:var(--accent);top:-80px;left:-80px;animation:drift 15s ease-in-out infinite; }
  .orb2 { width:280px;height:280px;background:var(--accent2);bottom:-40px;right:60px;animation:drift 20s ease-in-out infinite reverse; }
  @keyframes drift { 0%,100%{transform:translate(0,0)} 50%{transform:translate(30px,20px)} }
  header, main { position:relative; z-index:1; }
</style>
</head>
<body>

<div class="orbs">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
</div>

<header>
  <div class="logo">KARAOKÉ</div>
  <div class="singers-bar" id="singersBar">
    <span class="empty-hint">En attente de chanteurs…</span>
  </div>
  <div class="status-pill waiting" id="statusPill">⏳ Personne</div>
</header>

<main>
  <section class="karaoke-zone">
    <div class="song-title" id="songTitle">Aucune chanson chargée</div>

    <div class="player-container">
      <video id="videoPlayer" controls></video>
      <audio id="audioPlayer" controls></audio>
      <div class="placeholder" id="placeholder">
        <div class="icon">🎬</div>
        <p>Charge une vidéo karaoké (.mp4, .webm)<br>ou un fichier audio (.mp3)</p>
      </div>
    </div>

    <div class="controls-row">
      <label class="btn-load" for="fileInput">📂 Charger une chanson</label>
      <input type="file" id="fileInput" accept="video/*,audio/*">
      <div class="vol-row">
        <span>🎵</span>
        <input type="range" id="volMusique" min="0" max="1" step="0.01" value="0.8">
        <span>Musique</span>
      </div>
      <div class="vol-row">
        <span>🎤</span>
        <input type="range" id="volVoix" min="0" max="2" step="0.01" value="1.2">
        <span>Voix</span>
      </div>
    </div>
  </section>

  <aside class="sidebar">
    <div>
      <div class="s-title">Scanner pour rejoindre</div>
      <div class="qr-wrap">
        <canvas id="qrCanvas"></canvas>
        <div class="join-url" id="joinUrl">Chargement…</div>
      </div>
    </div>

    <div>
      <div class="s-title">Niveaux des voix</div>
      <div class="vu-list" id="vuList">
        <span class="empty-hint">Personne connecté</span>
      </div>
    </div>
  </aside>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// ── Audio context ──────────────────────────────────────────────────────
const ctx = new (window.AudioContext || window.webkitAudioContext)();
const musicGain = ctx.createGain(); musicGain.gain.value = 0.8; musicGain.connect(ctx.destination);
const voiceGain = ctx.createGain(); voiceGain.gain.value = 1.2; voiceGain.connect(ctx.destination);

document.getElementById('volMusique').oninput = e => musicGain.gain.value = +e.target.value;
document.getElementById('volVoix').oninput = e => voiceGain.gain.value = +e.target.value;

// ── Fichier ────────────────────────────────────────────────────────────
let mediaSourceConnected = false;
document.getElementById('fileInput').onchange = (e) => {
  const file = e.target.files[0]; if(!file) return;
  const url = URL.createObjectURL(file);
  const isVideo = file.type.startsWith('video/');
  const vid = document.getElementById('videoPlayer');
  const aud = document.getElementById('audioPlayer');
  document.getElementById('placeholder').style.display = 'none';
  document.getElementById('songTitle').textContent = file.name.replace(/\.[^.]+$/,'');

  const el = isVideo ? vid : aud;
  const other = isVideo ? aud : vid;
  el.style.display = 'block';
  other.style.display = 'none';
  el.src = url;

  if (!mediaSourceConnected) {
    const src = ctx.createMediaElementSource(el);
    src.connect(musicGain);
    mediaSourceConnected = true;
  }
  if (ctx.state === 'suspended') ctx.resume();
  el.play();
};

// ── Socket + WebRTC ────────────────────────────────────────────────────
const socket = io({ reconnection: true, reconnectionDelay: 2000 });
socket.emit('register-host');
socket.on('connect', () => socket.emit('register-host'));

const peers = {};
const chips = {};
const vus = {};

socket.on('singer-joined', async ({ singerId, name }) => {
  if (peers[singerId]) return; // déjà connecté
  addChip(singerId, name);
  addVu(singerId, name);
  updateStatus();

  const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
  peers[singerId] = { pc, name };

  pc.onicecandidate = e => e.candidate && socket.emit('ice-candidate', { candidate: e.candidate, targetId: singerId });

  pc.ontrack = e => {
    if (ctx.state === 'suspended') ctx.resume();
    const source = ctx.createMediaStreamSource(e.streams[0]);
    const analyser = ctx.createAnalyser(); analyser.fftSize = 256;
    source.connect(analyser);
    analyser.connect(voiceGain);
    peers[singerId].analyser = analyser;
    if (chips[singerId]) chips[singerId].classList.add('active');
    animVu(singerId);
  };

  socket.on('offer', async ({ offer, singerId: sid }) => {
    if (sid !== singerId || !peers[sid]) return;
    await pc.setRemoteDescription(new RTCSessionDescription(offer));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    socket.emit('answer', { answer, singerId });
  });

  socket.on('ice-candidate', ({ candidate, fromId }) => {
    if (fromId !== singerId || !peers[singerId]) return;
    pc.addIceCandidate(new RTCIceCandidate(candidate)).catch(()=>{});
  });
});

socket.on('singer-left', ({ singerId }) => {
  removeSinger(singerId);
  updateStatus();
});

// ── UI helpers ─────────────────────────────────────────────────────────
function updateStatus() {
  const n = Object.keys(peers).length;
  const pill = document.getElementById('statusPill');
  if (n === 0) { pill.className='status-pill waiting'; pill.textContent='⏳ Personne'; }
  else { pill.className='status-pill ok'; pill.textContent=`✅ ${n} chanteur${n>1?'s':''}`; }
}

function addChip(id, name) {
  const bar = document.getElementById('singersBar');
  bar.querySelector('.empty-hint')?.remove();
  const el = document.createElement('div');
  el.className = 'singer-chip';
  el.id = 'chip-'+id;
  el.innerHTML = `<span class="mic-dot"></span><span>${name}</span>`;
  bar.appendChild(el);
  chips[id] = el;
}

function addVu(id, name) {
  const list = document.getElementById('vuList');
  list.querySelector('.empty-hint')?.remove();
  const el = document.createElement('div');
  el.className = 'vu-row'; el.id = 'vu-'+id;
  el.innerHTML = `<span class="vu-name">${name}</span><div class="vu-bg"><div class="vu-fill" id="vuf-${id}"></div></div>`;
  list.appendChild(el);
  vus[id] = document.getElementById('vuf-'+id);
}

function removeSinger(id) {
  peers[id]?.pc.close(); delete peers[id];
  document.getElementById('chip-'+id)?.remove(); delete chips[id];
  document.getElementById('vu-'+id)?.remove(); delete vus[id];
  const bar = document.getElementById('singersBar');
  if (!bar.querySelector('.singer-chip')) bar.innerHTML = '<span class="empty-hint">En attente de chanteurs…</span>';
  const list = document.getElementById('vuList');
  if (!list.querySelector('.vu-row')) list.innerHTML = '<span class="empty-hint">Personne connecté</span>';
}

function animVu(id) {
  const data = new Uint8Array(peers[id]?.analyser?.frequencyBinCount || 0);
  function loop() {
    if (!peers[id]) return;
    requestAnimationFrame(loop);
    peers[id].analyser.getByteFrequencyData(data);
    const avg = data.reduce((a,b)=>a+b,0)/data.length;
    if (vus[id]) vus[id].style.width = Math.min(100,(avg/128)*100)+'%';
  }
  loop();
}

// ── QR Code ────────────────────────────────────────────────────────────
const microUrl = window.location.origin + '/micro.html';
document.getElementById('joinUrl').textContent = microUrl;
new QRCode(document.getElementById('qrCanvas'), {
  text: microUrl, width: 150, height: 150,
  colorDark: '#000000', colorLight: '#ffffff',
  correctLevel: QRCode.CorrectLevel.M
});
</script>
</body>
</html>
